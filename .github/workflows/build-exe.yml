name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/build-exe.yml'
      - 'tools/build-exe.ps1'
      - 'tools/publish-windows.ps1'
      - 'build-exe.cmd'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build portable EXE package
        shell: pwsh
        run: ./tools/build-exe.ps1
      - name: Upload portable package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: phyphox-windows-win-x64
          path: |
            artifacts/phyphox-windows-win-x64.zip
            artifacts/phyphox-windows-win-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
